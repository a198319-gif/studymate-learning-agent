# SCG Cloud Gallery 前端部署配置（Nginx）
# 使用方法：
#   1. 将 dist 目录上传到服务器，例如 /www/scg-picture-frontend/dist
#   2. 将本文件复制到 /etc/nginx/conf.d/scg-picture.conf
#   3. 执行 nginx -t 校验，然后 nginx -s reload 重载

server {
    listen 80;
    server_name www.scg.asia 114.132.66.190;

    # 前端静态文件目录（按实际上传路径调整）
    root /www/scg-picture-frontend/dist;
    index index.html;

    # 单页应用 history 路由：刷新/直达子路由时回退到 index.html，避免 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # 反向代理后端接口（后端 context-path 为 /api，故保留完整路径转发）
    location /api/ {
        proxy_pass http://127.0.0.1:9999;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 与后端上传体积限制保持一致（后端为 30MB）
        client_max_body_size 30m;
        proxy_read_timeout 60s;
    }
}
