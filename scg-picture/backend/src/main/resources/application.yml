# 应用服务 WEB 访问端口
server:
  port: 9999
  servlet:
    context-path:   /api    #上下文路径  直接输入9999无法访问 要输入 9999/api才行
    session:
      cookie:
        max-age: 2592000 #cookie 30天过期

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: SCG-picture-backend

    #数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/scg_picture}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:change-me}

#redis配置
  redis:
    database: 0
    host: 127.0.0.1
    port: 6379
    timeout: 50000

#session配置 内容存储到redis
  session:
    store-type: redis
    timeout: 2592000 #30天

  #开发更大的文件上传体积
  servlet:
    multipart:
      max-file-size: 30MB

 # 图片分表配置
  shardingsphere:
    datasource:
      names: yu_picture
      yu_picture:
        type: com.zaxxer.hikari.HikariDataSource
        driver-class-name: com.mysql.cj.jdbc.Driver
        url: ${DB_URL:jdbc:mysql://localhost:3306/scg_picture}
        username: ${DB_USERNAME:root}
        password: ${DB_PASSWORD:change-me}
    rules:
      sharding:
        tables:
          picture:
            actual-data-nodes: scg_picture.picture # 动态分表 实际数据节点
            table-strategy:
              standard:
                sharding-column: spaceId  #根据哪一列进行分表
                sharding-algorithm-name: picture_sharding_algorithm  # 使用自定义分片算法
        sharding-algorithms:
          picture_sharding_algorithm:
            type: CLASS_BASED #基于类来自定义
            props:
              strategy: standard #标准策略
              algorithmClassName: com.scg.scgpicturebackend.manager.sharding.PictureShardingAlgorithm #实现类的路径
    props:
      sql-show: true #打印实际执行的sql

#整合mybatisplus
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false   #设置是否开启下划线自动转换成驼峰命名法
    #仅在开发环境打印日志
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    enable-sql-runner: true
    db-config:
      logic-delete-field: isDelete #逻辑删除字段
      logic-delete-value: 1 #逻辑删除字段值
      logic-not-delete-value: 0 #逻辑未删除字段值

#knife4j接口文档配置
knife4j:
  enable: true
  openapi:
    title: 官方文档
    version: 1.0
    group:
      default:
        api-rule: package
        api-rule-resources:
          - com.scg.scgpicturebackend.controller

