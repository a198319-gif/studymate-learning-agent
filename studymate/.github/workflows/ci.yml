name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: studymate_test
          MYSQL_USER: studymate
          MYSQL_PASSWORD: studymate_ci
          MYSQL_ROOT_PASSWORD: studymate_root_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pstudymate_root_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333

    env:
      NODE_ENV: test
      DATABASE_URL: mysql://studymate:studymate_ci@127.0.0.1:3306/studymate_test
      JWT_SECRET: ci-only-jwt-secret-with-at-least-32-characters
      CLIENT_URL: http://localhost:5173
      RUN_DATABASE_TESTS: 'true'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: |
          npm ci
          npm --prefix client ci
          python -m pip install -r backend/requirements-dev.txt
      - name: Apply database migrations
        run: python -m alembic -c backend/alembic.ini upgrade head
      - name: Verify Python backend
        run: |
          python -m ruff check backend
          python -m mypy backend/app
          python -m pytest backend/tests
          python -m compileall -q backend/app
      - name: Verify client
        run: |
          npm --prefix client run lint
          npm --prefix client run typecheck
          npm --prefix client run test
          npm --prefix client run build
      - name: Verify complete local build
        run: npm run local:build
